# Docker Compose Local Development Example
# Copy this file to docker-compose.yml and set your local environment values:

services:
  database:
    image: postgres:16-alpine
    container_name: brick_postgres
    environment:
      - POSTGRES_DB=BrickCompanyDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-YourStrongLocalPassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brick_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=BrickCompanyDB;Username=postgres;Password=${POSTGRES_PASSWORD:-YourStrongLocalPassword123!};
      - Jwt__SecretKey=${JWT_SECRET_KEY:-YourRandomJwtSecretKeyWithAtLeast32Characters!}
      - Jwt__Issuer=BrickShowcaseApi
      - Jwt__Audience=BrickShowcaseClient
      - AllowedOrigins=http://localhost:5173,http://localhost:3000
    ports:
      - "5247:8080"
    depends_on:
      - database
    restart: always
    volumes:
      - uploads_data:/app/wwwroot/uploads

volumes:
  postgres_data:
  uploads_data:
