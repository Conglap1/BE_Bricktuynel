# Docker Compose Local Development Example
# Copy this file to docker-compose.yml and set your local environment values:

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: brick_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrongLocalPassword123!}
    volumes:
      - mssql_data:/var/opt/mssql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brick_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=BrickCompanyDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrongLocalPassword123!};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:-YourRandomJwtSecretKeyWithAtLeast32Characters!}
      - Jwt__Issuer=BrickShowcaseApi
      - Jwt__Audience=BrickShowcaseClient
      - AllowedOrigins=http://localhost:5173,http://localhost:3000
    ports:
      - "5247:8080"
    depends_on:
      - database
    restart: always
    volumes:
      - uploads_data:/app/wwwroot/uploads

volumes:
  mssql_data:
  uploads_data:
