name: Deploy Backend (.NET 9) to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'gach-thuanloi-api' # Tên App Service trên Azure của bạn
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore BrickShowcase.sln

      - name: Build Project
        run: dotnet build BrickShowcase.sln --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish src/BrickShowcase.Api/BrickShowcase.Api.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
