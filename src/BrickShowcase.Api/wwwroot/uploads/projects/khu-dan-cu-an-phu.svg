<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#6DD5FA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Buildings -->
  <rect x="100" y="200" width="160" height="350" fill="#2C3E50" rx="4" filter="url(#shadow)"/>
  <rect x="300" y="140" width="200" height="410" fill="#34495E" rx="4" filter="url(#shadow)"/>
  <rect x="540" y="240" width="160" height="310" fill="#1F618D" rx="4" filter="url(#shadow)"/>
  <!-- Windows -->
  <g fill="#F1C40F" opacity="0.8">
    <rect x="130" y="230" width="30" height="40"/>
    <rect x="190" y="230" width="30" height="40"/>
    <rect x="130" y="300" width="30" height="40"/>
    <rect x="190" y="300" width="30" height="40"/>
    <rect x="340" y="180" width="40" height="50"/>
    <rect x="420" y="180" width="40" height="50"/>
    <rect x="340" y="260" width="40" height="50"/>
    <rect x="420" y="260" width="40" height="50"/>
  </g>
  <rect x="0" y="520" width="800" height="80" fill="#27AE60"/>
  <text x="400" y="570" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Khu Dân Cư An Phú</text>
</svg>
