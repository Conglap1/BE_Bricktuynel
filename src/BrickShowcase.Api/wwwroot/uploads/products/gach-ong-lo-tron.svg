<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D35400" />
      <stop offset="100%" stop-color="#8E44AD" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#EDBB99"/>
  <rect x="150" y="120" width="500" height="360" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Round Holes -->
  <circle cx="255" cy="225" r="50" fill="#4A235A"/>
  <circle cx="400" cy="225" r="50" fill="#4A235A"/>
  <circle cx="545" cy="225" r="50" fill="#4A235A"/>
  <circle cx="255" cy="375" r="50" fill="#4A235A"/>
  <circle cx="400" cy="375" r="50" fill="#4A235A"/>
  <circle cx="545" cy="375" r="50" fill="#4A235A"/>
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6E2C00" text-anchor="middle">Gạch Ống Lỗ Tròn</text>
</svg>
