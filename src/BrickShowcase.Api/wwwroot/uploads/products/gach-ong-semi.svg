<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E67E22" />
      <stop offset="100%" stop-color="#A04000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#F5CBA7"/>
  <rect x="150" y="180" width="500" height="240" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Semi holes -->
  <rect x="210" y="235" width="90" height="130" rx="45" fill="#6E2C00"/>
  <rect x="355" y="235" width="90" height="130" rx="45" fill="#6E2C00"/>
  <rect x="500" y="235" width="90" height="130" rx="45" fill="#6E2C00"/>
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#A04000" text-anchor="middle">Gạch Ống Semi</text>
</svg>
